name: Deploy Voyage XXVI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - uses: actions/checkout@v4

      - name: Extract website
        run: unzip -o voyage.zip -d website

      - name: Repair authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("website/dist/members.js")
          s = p.read_text()

          def patch(old, new):
              global s
              assert old in s, "Patch target missing: " + old
              s = s.replace(old, new, 1)

          patch(
              "function setSession(t){token=t;token.expires_at=t.expires_at||Date.now()/1000+t.expires_in}",
              """function updateAccountButton(){
                const b=document.getElementById('sign-in');
                if(b)b.textContent=token?'My Account':'Sign in';
              }
              function setSession(t){
                token=t;
                token.expires_at=t.expires_at||Date.now()/1000+t.expires_in;
                try{localStorage.setItem('v26-session',JSON.stringify(token))}catch{}
                updateAccountButton();
              }"""
          )

          patch(
              "function clear(){token=null;",
              """function clear(){
                try{localStorage.removeItem('v26-session')}catch{}
                token=null;
                updateAccountButton();"""
          )

          patch(
              "if(!configured)return;try{const params=",
              """if(!configured)return;try{
                try{
                  const saved=JSON.parse(localStorage.getItem('v26-session'));
                  if(saved?.refresh_token){
                    token=saved;
                    if(token.expires_at<Date.now()/1000+40){
                      setSession(await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:token.refresh_token}));
                    }
                  }
                }catch{clear()}
                const params="""
          )

          patch(
              "settings=await rpc('state');if(token&&settings.active)await load();route();",
              "settings=await rpc('state');if(token&&settings.active)await load();updateAccountButton();route();"
          )

          patch(
              "Your session is held in memory.",
              "Your session is remembered on this browser."
          )

          p.write_text(s)

          h = Path("website/dist/index.html")
          h.write_text(h.read_text().replace(
              'src="members.js"',
              'src="members.js?v=3"'
          ))

          print("Authentication patches applied.")
          PY
          node --check website/dist/members.js
      - name: Enable instant community publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("website/dist/members.js")
          s = p.read_text()
          s = s.replace("Submit for review", "Publish Post")
          s = s.replace("Submitted for moderation", "Successfully published")
          s = s.replace("approved reviews", "published reviews")
          p.write_text(s)
          PY
      - name: Upgrade community social feed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("website/dist/members.js")
          s = p.read_text()

          start = s.index("async function community(")
          end = s.index("async function admin(", start)
          original = s[start:end].replace(
              "async function community(",
              "async function legacyCommunity(", 1)

          replacement = r"""
          let socialTab='all';

          async function community(hash,area){
            if(hash==='rankings'||!configured||!settings.community)
              return legacyCommunity(hash,area);

            let data=await rpc('feed',{page_no:feedPage});
            let state={links:[],saved:[]};

            if(token&&settings.active)
              state=await rpc('social');

            if(socialTab==='following'){
              const following=new Set(
                state.links.filter(x=>x.kind==='follow')
                .map(x=>x.handle));
              data=data.filter(x=>following.has(x.username));
            }

            area.innerHTML=`
              <div class="vx-feed">
                <div class="vx-tabs">
                  <button data-do="all">For You</button>
                  <button data-do="following">Following</button>
                  <button data-do="people">Discover</button>
                </div>
                <div class="vx-compose">
                  <strong>Share your voyage</strong>
                  <p>Where has your journey taken you?</p>
                  ${button('Create post','discussion')}
                  ${button('Activity','activity')}
                </div>
                ${data.map(r=>{
                  const liked=state.saved.some(
                    x=>x.id===r.id&&x.kind==='like');
                  const saved=state.saved.some(
                    x=>x.id===r.id&&x.kind==='save');
                  return `
                    <article class="vx-post">
                      <div class="vx-author">
                        <div class="vx-avatar">
                          ${html(r.username.slice(0,2).toUpperCase())}
                        </div>
                        <div>
                          <strong>${html(r.username)}</strong>
                          <small>@${html(r.username)} ·
                            ${html(new Date(r.created_at).toLocaleDateString())}
                          </small>
                        </div>
                        ${button('Profile','author:'+r.username)}
                      </div>
                      <h3>${html(r.title)}</h3>
                      ${r.destination?`<small>📍 ${html(r.destination)}</small>`:''}
                      <p class="vx-story">${html(r.body)}</p>
                      <div class="vx-actions">
                        ${button(liked?'♥ Liked':'♡ Like','like:'+r.id)}
                        ${button('☏ Comment','comments:'+r.id)}
                        ${button(saved?'Saved':'Bookmark','save:'+r.id)}
                        ${button('Share','share:'+r.id)}
                        ${button('Report','report:'+r.id)}
                      </div>
                    </article>`;
                }).join('')}
                ${data.length?'':'<p>No posts in this feed yet.</p>'}
                <div class="vx-actions">
                  ${feedPage?button('Previous','prev'):''}
                  ${button('Next','next')}
                </div>
              </div>`;

            area.querySelector(
              '[data-do="'+socialTab+'"]'
            )?.classList.add('vx-selected');

            area.onclick=async e=>{
              const b=e.target.closest('[data-do]');
              if(!b)return;
              const cmd=b.dataset.do;
              const [op,id]=cmd.split(':');
              try{
                if(cmd==='all'||cmd==='following'){
                  if(cmd==='following'&&!ready())return;
                  socialTab=cmd;
                  feedPage=0;
                  await community(hash,area);
                }
                if(cmd==='people')social.people();
                if(cmd==='activity'&&ready())
                  await social.activity();
                if(cmd==='discussion')publish('discussion');
                if(op==='author')await social.profile(id);
                if(op==='comments')await social.comments(id);
                if(['like','save'].includes(op)&&ready()){
                  await rpc('react',{
                    pid:id,op,
                    enabled:!state.saved.some(
                      x=>x.id===id&&x.kind===op)
                  });
                  await community(hash,area);
                }
                if(op==='share'){
                  const r=data.find(x=>x.id===id);
                  const url=location.origin+
                    location.pathname+'#community';
                  if(navigator.share)
                    await navigator.share({
                      title:r.title,text:r.body,url
                    });
                  else{
                    await navigator.clipboard.writeText(url);
                    message('Community link copied.');
                  }
                }
                if(op==='report'&&ready())
                  form('Report content',
                    field('reason','Reason','textarea'),
                    async d=>{
                      await rpc('report',{
                        post_id:id,details:d.reason
                      });
                      modal('<h2>Report received</h2>');
                    },'Send report');
                if(cmd==='next'||cmd==='prev'){
                  feedPage=Math.max(0,feedPage+
                    (cmd==='next'?1:-1));
                  await community(hash,area);
                }
              }catch(err){message(err)}
            };
          }
          """

          s=s[:start]+original+replacement+s[end:]
          s=s.replace("Submit for review","Publish Post")
          s=s.replace(
              "modal('<h2>Submitted for moderation</h2>')",
              "shut();go('community')"
          )
          p.write_text(s)

          css = Path("website/dist/social-feed.css")
          css.write_text("""
          .vx-feed {
            max-width:680px;
            margin:0 auto;
          }
          .vx-tabs {
            display:flex;
            justify-content:space-around;
            border-bottom:1px solid #77889944;
            margin-bottom:18px;
          }
          .vx-tabs button {
            background:transparent;
            color:inherit;
            border:0;
            padding:16px 10px;
            font-weight:600;
            cursor:pointer;
          }
          .vx-tabs .vx-selected {
            border-bottom:3px solid #ba9a60;
          }
          .vx-compose,.vx-post {
            border:1px solid #77889944;
            border-radius:16px;
            padding:18px;
            margin-bottom:14px;
          }
          .vx-author {
            display:flex;
            align-items:center;
            gap:12px;
          }
          .vx-author small {
            display:block;
            opacity:.65;
            font-size:12px;
          }
          .vx-author .btn {
            margin-left:auto;
          }
          .vx-avatar {
            width:44px;
            height:44px;
            flex-shrink:0;
            border-radius:50%;
            background:#284d5b;
            color:white;
            display:grid;
            place-items:center;
            font-weight:700;
          }
          .vx-story {
            white-space:pre-wrap;
            overflow-wrap:anywhere;
            line-height:1.65;
          }
          .vx-actions {
            display:flex;
            flex-wrap:wrap;
            gap:6px;
            border-top:1px solid #77889933;
            padding-top:12px;
          }
          .vx-actions .btn {
            border:0;
            background:transparent;
            color:inherit;
            font-size:13px;
            padding:8px;
          }
          .vx-post h3 {
            margin:16px 0 6px;
          }
          """)

          h=Path("website/dist/index.html")
          t=h.read_text()
          t=t.replace("</head>",
              '<link rel="stylesheet" href="social-feed.css"></head>')
          import re
          t=re.sub(r'members\.js(?:\?[^"]*)?"',
                   'members.js?v=community4"',t)
          h.write_text(t)
          PY
          node --check website/dist/members.js
      - name: Connect Supabase
        working-directory: website
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/configure.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - uses: actions/deploy-pages@v4
