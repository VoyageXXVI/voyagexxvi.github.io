name: Deploy Voyage XXVI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - uses: actions/checkout@v4

      - name: Extract website
        run: unzip -o voyage.zip -d website

      - name: Repair authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("website/dist/members.js")
          s = p.read_text()

          def patch(old,new):
              global s
              assert old in s, "Missing target: "+old
              s=s.replace(old,new,1)

          patch(
              "function setSession(t){token=t;token.expires_at=t.expires_at||Date.now()/1000+t.expires_in}",
              """function updateAccountButton(){
                const b=document.getElementById('sign-in');
                if(b)b.textContent=token?'My Account':'Sign in';
              }
              function setSession(t){
                token=t;
                token.expires_at=t.expires_at||Date.now()/1000+t.expires_in;
                try{localStorage.setItem('v26-session',JSON.stringify(token))}catch{}
                updateAccountButton();
              }"""
          )

          patch(
              "function clear(){token=null;",
              """function clear(){
                try{localStorage.removeItem('v26-session')}catch{}
                token=null;
                updateAccountButton();"""
          )

          patch(
              "if(!configured)return;try{const params=",
              """if(!configured)return;try{
                try{
                  const saved=JSON.parse(localStorage.getItem('v26-session'));
                  if(saved?.refresh_token){
                    token=saved;
                    if(token.expires_at<Date.now()/1000+40){
                      setSession(await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:token.refresh_token}));
                    }
                  }
                }catch{clear()}
                const params="""
          )

          patch(
              "settings=await rpc('state');if(token&&settings.active)await load();route();",
              "settings=await rpc('state');if(token&&settings.active)await load();updateAccountButton();route();"
          )

          s=s.replace(
              "Your session is held in memory.",
              "Your session is remembered on this browser."
          )

          s=s.replace("Submit for review","Publish Post")
          s=s.replace("Submitted for moderation","Successfully published")
          s=s.replace("approved reviews","published reviews")

          p.write_text(s)
          PY

      - name: Upgrade community and repair photo uploads
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re

          p=Path("website/dist/members.js")
          s=p.read_text()

          start=s.index("async function community(")
          end=s.index("async function admin(",start)

          original=s[start:end].replace(
              "async function community(",
              "async function legacyCommunity(",1
          )

          replacement=r"""
          const vxUrl=__VX_URL__;
          const vxKey=__VX_KEY__;
          let socialTab='all';

          async function compressPhoto(file){
            const url=URL.createObjectURL(file);
            try{
              const img=new Image();
              img.src=url;
              await img.decode();

              const canvas=document.createElement('canvas');
              const scale=Math.min(1,1600/Math.max(img.width,img.height));

              canvas.width=Math.max(1,Math.round(img.width*scale));
              canvas.height=Math.max(1,Math.round(img.height*scale));

              const ctx=canvas.getContext('2d');
              ctx.fillStyle='#ffffff';
              ctx.fillRect(0,0,canvas.width,canvas.height);
              ctx.drawImage(img,0,0,canvas.width,canvas.height);

              for(let q=.85;q>=.15;q-=.1){
                const blob=await new Promise(resolve=>
                  canvas.toBlob(resolve,'image/jpeg',q));

                if(blob&&blob.size<=512000)return blob;
              }

              throw Error('Photo is too large.');
            }finally{
              URL.revokeObjectURL(url);
            }
          }

          async function vxRequest(path,options={}){
            const response=await fetch(vxUrl+path,{
              ...options,
              headers:{
                apikey:vxKey,
                Authorization:'Bearer '+(token?.access_token||vxKey),
                ...(options.headers||{})
              }
            });

            const raw=await response.text();
            let result;
            try{result=JSON.parse(raw)}
            catch{result=raw}

            if(!response.ok){
              throw Error(
                result?.message||
                result?.error_description||
                result?.error||
                raw||
                'Request failed'
              );
            }

            return result;
          }

          async function publishPhotos(hash,area){
            if(!token){
              alert('Please sign in before uploading photos.');
              return;
            }

            if(!ready()){
              alert('Please complete your traveller account setup.');
              return;
            }

            document.getElementById('vx-photo-dialog')?.remove();

            const dialog=document.createElement('dialog');
            dialog.id='vx-photo-dialog';
            dialog.className='vx-dialog';

            dialog.innerHTML=`
              <form id="vx-photo-form">
                <div class="vx-dialog-header">
                  <h2>New photo post</h2>
                  <button type="button" id="vx-close">×</button>
                </div>

                <label>Title
                  <input name="title" required maxlength="150"
                    placeholder="Give your voyage a title">
                </label>

                <label>Caption
                  <textarea name="story" required minlength="10"
                    placeholder="Tell us about your journey"></textarea>
                </label>

                <label>Travel photographs
                  <input id="vx-files" type="file"
                    accept="image/jpeg,image/png,image/webp"
                    multiple required>
                </label>

                <small>Up to four photographs. Images are compressed automatically.</small>

                <div id="vx-preview" class="vx-preview"></div>

                <label class="vx-rights">
                  <input type="checkbox" name="rights" required>
                  I own these photographs or have permission to publish them publicly.
                </label>

                <p id="vx-status" role="status"></p>

                <button class="vx-publish" type="submit">
                  Publish photos
                </button>
              </form>
            `;

            document.body.appendChild(dialog);

            const uploadForm=dialog.querySelector('form');
            const input=dialog.querySelector('#vx-files');
            const preview=dialog.querySelector('#vx-preview');
            const status=dialog.querySelector('#vx-status');
            const submit=uploadForm.querySelector('[type="submit"]');
            const close=dialog.querySelector('#vx-close');

            let previewUrls=[];
            let busy=false;

            function cleanup(){
              previewUrls.forEach(url=>URL.revokeObjectURL(url));
              previewUrls=[];
            }

            close.onclick=()=>{
              if(!busy)dialog.close();
            };

            dialog.addEventListener('cancel',e=>{
              if(busy)e.preventDefault();
            });

            dialog.addEventListener('close',()=>{
              cleanup();
              dialog.remove();
            });

            input.onchange=()=>{
              cleanup();
              preview.innerHTML='';
              status.textContent='';

              const files=[...input.files];

              if(files.length>4){
                input.value='';
                status.textContent='Maximum four photos.';
                return;
              }

              for(const file of files){
                const url=URL.createObjectURL(file);
                previewUrls.push(url);
                const img=document.createElement('img');
                img.src=url;
                img.alt='Photo preview';
                preview.appendChild(img);
              }
            };

            uploadForm.onsubmit=async e=>{
              e.preventDefault();

              if(busy)return;

              const files=[...input.files];
              const title=uploadForm.elements.title.value.trim();
              const story=uploadForm.elements.story.value.trim();
              const rights=uploadForm.elements.rights.checked;

              if(files.length<1||files.length>4){
                status.textContent='Select one to four photos.';
                return;
              }

              if(!title||story.length<10||!rights){
                status.textContent='Complete the title, caption and agreement.';
                return;
              }

              busy=true;
              submit.disabled=true;
              close.disabled=true;

              const paths=[];
              let published=false;
              let publishing=false;

              try{
                status.textContent='Checking account...';

                const user=await vxRequest('/auth/v1/user');

                for(let i=0;i<files.length;i++){
                  status.textContent=
                    'Uploading photo '+(i+1)+' of '+files.length+'...';

                  const blob=await compressPhoto(files[i]);

                  const path=user.id+'/'+crypto.randomUUID()+'.jpg';

                  await vxRequest(
                    '/storage/v1/object/voyage-photos/'+path,{
                      method:'POST',
                      headers:{
                        'Content-Type':'image/jpeg'
                      },
                      body:blob
                    }
                  );

                  paths.push(path);
                }

                status.textContent='Publishing your voyage...';

                publishing=true;

                await vxRequest('/rest/v1/rpc/v26_publish_photo',{
                  method:'POST',
                  headers:{
                    'Content-Type':'application/json'
                  },
                  body:JSON.stringify({
                    heading:title,
                    content:story,
                    photo_paths:paths,
                    rights:true
                  })
                });

                published=true;
                busy=false;
                dialog.close();

                socialTab='all';
                feedPage=0;

                await community(hash,area);

              }catch(err){
                if(!published&&!publishing&&paths.length){
                  try{
                    await vxRequest('/storage/v1/object/voyage-photos',{
                      method:'DELETE',
                      headers:{
                        'Content-Type':'application/json'
                      },
                      body:JSON.stringify({prefixes:paths})
                    });
                  }catch{}
                }

                if(published){
                  alert('Post published. Please refresh the feed.');
                }else{
                  status.textContent=String(err.message||err);
                }
              }finally{
                busy=false;
                submit.disabled=false;
                close.disabled=false;
              }
            };

            dialog.showModal();
          }

          async function community(hash,area){
            if(hash==='rankings'||!configured||!settings.community)
              return legacyCommunity(hash,area);

            let data=await rpc('feed',{page_no:feedPage});
            let state={links:[],saved:[]};
            let photoMap=new Map();

            try{
              const photos=await rpc('feed_photos',{
                page_no:feedPage
              });
              photoMap=new Map(photos.map(x=>[x.id,x.photos]));
            }catch(err){
              console.warn('Photo feed unavailable',err);
            }

            if(token&&settings.active)
              state=await rpc('social');

            if(socialTab==='following'){
              const following=new Set(
                state.links.filter(x=>x.kind==='follow')
                .map(x=>x.handle)
              );

              data=data.filter(x=>following.has(x.username));
            }

            area.innerHTML=`
              <div class="vx-feed">

                <div class="vx-tabs">
                  <button data-do="all">For You</button>
                  <button data-do="following">Following</button>
                  <button data-do="people">Discover</button>
                </div>

                <div class="vx-compose">
                  <strong>Share your voyage</strong>
                  <p>Where has your journey taken you?</p>

                  ${button('Create post','discussion')}
                  ${button('Add photos','photo-post')}
                  ${button('Activity','activity')}
                </div>

                ${data.map(r=>{
                  const liked=state.saved.some(
                    x=>x.id===r.id&&x.kind==='like'
                  );

                  const saved=state.saved.some(
                    x=>x.id===r.id&&x.kind==='save'
                  );

                  return `
                    <article class="vx-post">

                      <div class="vx-author">
                        <div class="vx-avatar">
                          ${html(r.username.slice(0,2).toUpperCase())}
                        </div>

                        <div>
                          <strong>${html(r.username)}</strong>
                          <small>@${html(r.username)} ·
                            ${html(new Date(r.created_at).toLocaleDateString())}
                          </small>
                        </div>

                        ${button('Profile','author:'+r.username)}
                      </div>

                      <h3>${html(r.title)}</h3>

                      ${r.destination?
                        `<small>Location: ${html(r.destination)}</small>`:''}

                      <p class="vx-story">${html(r.body)}</p>

                      <div class="vx-photos">
                        ${(photoMap.get(r.id)||[]).map(path=>{
                          const src=vxUrl+
                            '/storage/v1/object/public/voyage-photos/'+
                            path.split('/').map(encodeURIComponent).join('/');

                          return `<a href="${html(src)}"
                            target="_blank" rel="noopener">
                            <img src="${html(src)}"
                              loading="lazy" alt="Travel photograph">
                          </a>`;
                        }).join('')}
                      </div>

                      <div class="vx-actions">
                        ${button(liked?'♥ Liked':'♡ Like','like:'+r.id)}
                        ${button('Comment','comments:'+r.id)}
                        ${button(saved?'Saved':'Bookmark','save:'+r.id)}
                        ${button('Share','share:'+r.id)}
                        ${button('Report','report:'+r.id)}
                      </div>

                    </article>`;
                }).join('')}

                ${data.length?'':'<p>No posts in this feed yet.</p>'}

                <div class="vx-actions">
                  ${feedPage?button('Previous','prev'):''}
                  ${button('Next','next')}
                </div>

              </div>`;

            area.querySelector(
              '[data-do="'+socialTab+'"]'
            )?.classList.add('vx-selected');

            area.onclick=async e=>{
              const b=e.target.closest('[data-do]');
              if(!b)return;

              const cmd=b.dataset.do;
              const [op,id]=cmd.split(':');

              try{
                if(cmd==='all'||cmd==='following'){
                  if(cmd==='following'&&!ready())return;
                  socialTab=cmd;
                  feedPage=0;
                  await community(hash,area);
                }

                if(cmd==='people')await social.people();

                if(cmd==='activity'&&ready())
                  await social.activity();

                if(cmd==='discussion')
                  await publish('discussion');

                if(cmd==='photo-post')
                  await publishPhotos(hash,area);

                if(op==='author')
                  await social.profile(id);

                if(op==='comments')
                  await social.comments(id);

                if(['like','save'].includes(op)&&ready()){
                  await rpc('react',{
                    pid:id,
                    op,
                    enabled:!state.saved.some(
                      x=>x.id===id&&x.kind===op
                    )
                  });

                  await community(hash,area);
                }

                if(op==='share'){
                  const r=data.find(x=>x.id===id);
                  const url=location.origin+
                    location.pathname+'#community';

                  if(navigator.share){
                    await navigator.share({
                      title:r.title,
                      text:r.body,
                      url
                    });
                  }else{
                    await navigator.clipboard.writeText(url);
                    message('Community link copied.');
                  }
                }

                if(op==='report'&&ready()){
                  form('Report content',
                    field('reason','Reason','textarea'),
                    async d=>{
                      await rpc('report',{
                        post_id:id,
                        details:d.reason
                      });
                      modal('<h2>Report received</h2>');
                    },'Send report'
                  );
                }

                if(cmd==='next'||cmd==='prev'){
                  feedPage=Math.max(0,feedPage+
                    (cmd==='next'?1:-1));

                  await community(hash,area);
                }

              }catch(err){
                alert(String(err.message||err));
              }
            };
          }
          """

          url=os.environ["SUPABASE_URL"].rstrip("/")
          key=os.environ["SUPABASE_PUBLISHABLE_KEY"]

          assert url.startswith("https://")
          assert key

          replacement=replacement.replace(
              "__VX_URL__",json.dumps(url)
          ).replace(
              "__VX_KEY__",json.dumps(key)
          )

          s=s[:start]+original+replacement+s[end:]
          p.write_text(s)

          css=Path("website/dist/social-feed.css")

          css.write_text("""
          .vx-feed{
            max-width:760px;
            margin:0 auto;
          }

          .vx-tabs{
            display:flex;
            justify-content:space-around;
            border-bottom:1px solid #77889944;
            margin-bottom:18px;
          }

          .vx-tabs button{
            background:transparent;
            color:inherit;
            border:0;
            padding:16px 10px;
            font-weight:600;
            cursor:pointer;
          }

          .vx-tabs .vx-selected{
            border-bottom:3px solid #ba9a60;
          }

          .vx-compose,.vx-post{
            border:1px solid #77889944;
            border-radius:16px;
            padding:18px;
            margin-bottom:14px;
          }

          .vx-author{
            display:flex;
            align-items:center;
            gap:12px;
          }

          .vx-author small{
            display:block;
            opacity:.65;
            font-size:12px;
          }

          .vx-author .btn{
            margin-left:auto;
          }

          .vx-avatar{
            width:44px;
            height:44px;
            flex-shrink:0;
            border-radius:50%;
            background:#284d5b;
            color:white;
            display:grid;
            place-items:center;
            font-weight:700;
          }

          .vx-story{
            white-space:pre-wrap;
            overflow-wrap:anywhere;
            line-height:1.65;
          }

          .vx-actions{
            display:flex;
            flex-wrap:wrap;
            gap:6px;
            border-top:1px solid #77889933;
            padding-top:12px;
          }

          .vx-actions .btn{
            border:0;
            background:transparent;
            color:inherit;
            font-size:13px;
            padding:8px;
          }

          .vx-post h3{
            margin:16px 0 6px;
          }

          .vx-photos{
            display:flex;
            overflow-x:auto;
            scroll-snap-type:x mandatory;
            gap:8px;
            border-radius:12px;
            margin-bottom:12px;
          }

          .vx-photos:empty{
            display:none;
          }

          .vx-photos a{
            flex:0 0 100%;
            scroll-snap-align:start;
          }

          .vx-photos img{
            width:100%;
            max-height:650px;
            object-fit:contain;
            display:block;
            border-radius:12px;
          }

          .vx-dialog{
            width:min(520px,90vw);
            max-height:85dvh;
            overflow:auto;
            box-sizing:border-box;
            padding:24px;
            border:1px solid #c9bda4;
            border-radius:20px;
            background:#faf7ef;
            color:#183b36;
            z-index:99999;
          }

          .vx-dialog::backdrop{
            background:rgba(0,0,0,.65);
          }

          .vx-dialog-header{
            display:flex;
            align-items:center;
            justify-content:space-between;
          }

          .vx-dialog-header button{
            border:0;
            background:transparent;
            color:inherit;
            font-size:30px;
            cursor:pointer;
          }

          .vx-dialog label{
            display:block;
            margin:14px 0;
            font-weight:600;
          }

          .vx-dialog input:not([type=checkbox]),
          .vx-dialog textarea{
            display:block;
            box-sizing:border-box;
            width:100%;
            padding:12px;
            margin-top:8px;
            border:1px solid #c9bda4;
            border-radius:10px;
            background:white;
            color:#183b36;
            font-size:16px;
          }

          .vx-dialog textarea{
            min-height:110px;
            resize:vertical;
          }

          .vx-preview{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:8px;
            margin-top:12px;
          }

          .vx-preview img{
            width:100%;
            height:130px;
            object-fit:cover;
            border-radius:10px;
          }

          .vx-rights{
            font-size:13px;
            line-height:1.5;
          }

          .vx-publish{
            width:100%;
            padding:14px;
            background:#183b36;
            color:white;
            border:0;
            border-radius:12px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
          }

          .vx-publish:disabled{
            opacity:.5;
          }

          #vx-status{
            font-size:14px;
            overflow-wrap:anywhere;
          }
          """)

          h=Path("website/dist/index.html")
          t=h.read_text()

          t=t.replace(
              "</head>",
              '<link rel="stylesheet" href="social-feed.css?v=7"></head>'
          )

          t=re.sub(
              r'members\.js(?:\?[^"]*)?"',
              'members.js?v=community7"',
              t
          )

          h.write_text(t)
          PY

          node --check website/dist/members.js

      - name: Connect Supabase
        working-directory: website
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/configure.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - uses: actions/deploy-pages@v4

