name: Deploy Voyage XXVI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - uses: actions/checkout@v4

      - name: Extract website
        run: unzip -o voyage.zip -d website

      - name: Repair authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("website/dist/members.js")
          s = p.read_text()

          def patch(old, new):
              global s
              assert old in s, "Patch target missing: " + old
              s = s.replace(old, new, 1)

          patch(
              "function setSession(t){token=t;token.expires_at=t.expires_at||Date.now()/1000+t.expires_in}",
              """function updateAccountButton(){
                const b=document.getElementById('sign-in');
                if(b)b.textContent=token?'My Account':'Sign in';
              }
              function setSession(t){
                token=t;
                token.expires_at=t.expires_at||Date.now()/1000+t.expires_in;
                try{localStorage.setItem('v26-session',JSON.stringify(token))}catch{}
                updateAccountButton();
              }"""
          )

          patch(
              "function clear(){token=null;",
              """function clear(){
                try{localStorage.removeItem('v26-session')}catch{}
                token=null;
                updateAccountButton();"""
          )

          patch(
              "if(!configured)return;try{const params=",
              """if(!configured)return;try{
                try{
                  const saved=JSON.parse(localStorage.getItem('v26-session'));
                  if(saved?.refresh_token){
                    token=saved;
                    if(token.expires_at<Date.now()/1000+40){
                      setSession(await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:token.refresh_token}));
                    }
                  }
                }catch{clear()}
                const params="""
          )

          patch(
              "settings=await rpc('state');if(token&&settings.active)await load();route();",
              "settings=await rpc('state');if(token&&settings.active)await load();updateAccountButton();route();"
          )

          patch(
              "Your session is held in memory.",
              "Your session is remembered on this browser."
          )

          p.write_text(s)

          h = Path("website/dist/index.html")
          h.write_text(h.read_text().replace(
              'src="members.js"',
              'src="members.js?v=3"'
          ))

          print("Authentication patches applied.")
          PY
          node --check website/dist/members.js
      - name: Enable instant community publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("website/dist/members.js")
          s = p.read_text()
          s = s.replace("Submit for review", "Publish Post")
          s = s.replace("Submitted for moderation", "Successfully published")
          s = s.replace("approved reviews", "published reviews")
          p.write_text(s)
          PY
      - name: Upgrade community social feed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("website/dist/members.js")
          s = p.read_text()

          start = s.index("async function community(")
          end = s.index("async function admin(", start)
          original = s[start:end].replace(
              "async function community(",
              "async function legacyCommunity(", 1)

          replacement = r"""
          let socialTab='all';

          async function community(hash,area){
            if(hash==='rankings'||!configured||!settings.community)
              return legacyCommunity(hash,area);

            let data=await rpc('feed',{page_no:feedPage});
            let state={links:[],saved:[]};

            if(token&&settings.active)
              state=await rpc('social');

            if(socialTab==='following'){
              const following=new Set(
                state.links.filter(x=>x.kind==='follow')
                .map(x=>x.handle));
              data=data.filter(x=>following.has(x.username));
            }

            area.innerHTML=`
              <div class="vx-feed">
                <div class="vx-tabs">
                  <button data-do="all">For You</button>
                  <button data-do="following">Following</button>
                  <button data-do="people">Discover</button>
                </div>
                <div class="vx-compose">
                  <strong>Share your voyage</strong>
                  <p>Where has your journey taken you?</p>
                  ${button('Create post','discussion')}
                  ${button('Activity','activity')}
                </div>
                ${data.map(r=>{
                  const liked=state.saved.some(
                    x=>x.id===r.id&&x.kind==='like');
                  const saved=state.saved.some(
                    x=>x.id===r.id&&x.kind==='save');
                  return `
                    <article class="vx-post">
                      <div class="vx-author">
                        <div class="vx-avatar">
                          ${html(r.username.slice(0,2).toUpperCase())}
                        </div>
                        <div>
                          <strong>${html(r.username)}</strong>
                          <small>@${html(r.username)} ·
                            ${html(new Date(r.created_at).toLocaleDateString())}
                          </small>
                        </div>
                        ${button('Profile','author:'+r.username)}
                      </div>
                      <h3>${html(r.title)}</h3>
                      ${r.destination?`<small>📍 ${html(r.destination)}</small>`:''}
                      <p class="vx-story">${html(r.body)}</p>
                      <div class="vx-actions">
                        ${button(liked?'♥ Liked':'♡ Like','like:'+r.id)}
                        ${button('☏ Comment','comments:'+r.id)}
                        ${button(saved?'Saved':'Bookmark','save:'+r.id)}
                        ${button('Share','share:'+r.id)}
                        ${button('Report','report:'+r.id)}
                      </div>
                    </article>`;
                }).join('')}
                ${data.length?'':'<p>No posts in this feed yet.</p>'}
                <div class="vx-actions">
                  ${feedPage?button('Previous','prev'):''}
                  ${button('Next','next')}
                </div>
              </div>`;

            area.querySelector(
              '[data-do="'+socialTab+'"]'
            )?.classList.add('vx-selected');

            area.onclick=async e=>{
              const b=e.target.closest('[data-do]');
              if(!b)return;
              const cmd=b.dataset.do;
              const [op,id]=cmd.split(':');
              try{
                if(cmd==='all'||cmd==='following'){
                  if(cmd==='following'&&!ready())return;
                  socialTab=cmd;
                  feedPage=0;
                  await community(hash,area);
                }
                if(cmd==='people')social.people();
                if(cmd==='activity'&&ready())
                  await social.activity();
                if(cmd==='discussion')publish('discussion');
                if(op==='author')await social.profile(id);
                if(op==='comments')await social.comments(id);
                if(['like','save'].includes(op)&&ready()){
                  await rpc('react',{
                    pid:id,op,
                    enabled:!state.saved.some(
                      x=>x.id===id&&x.kind===op)
                  });
                  await community(hash,area);
                }
                if(op==='share'){
                  const r=data.find(x=>x.id===id);
                  const url=location.origin+
                    location.pathname+'#community';
                  if(navigator.share)
                    await navigator.share({
                      title:r.title,text:r.body,url
                    });
                  else{
                    await navigator.clipboard.writeText(url);
                    message('Community link copied.');
                  }
                }
                if(op==='report'&&ready())
                  form('Report content',
                    field('reason','Reason','textarea'),
                    async d=>{
                      await rpc('report',{
                        post_id:id,details:d.reason
                      });
                      modal('<h2>Report received</h2>');
                    },'Send report');
                if(cmd==='next'||cmd==='prev'){
                  feedPage=Math.max(0,feedPage+
                    (cmd==='next'?1:-1));
                  await community(hash,area);
                }
              }catch(err){message(err)}
            };
          }
          """

          s=s[:start]+original+replacement+s[end:]
          s=s.replace("Submit for review","Publish Post")
          s=s.replace(
              "modal('<h2>Submitted for moderation</h2>')",
              "shut();go('community')"
          )
          p.write_text(s)

          css = Path("website/dist/social-feed.css")
          css.write_text("""
          .vx-feed {
            max-width:680px;
            margin:0 auto;
          }
          .vx-tabs {
            display:flex;
            justify-content:space-around;
            border-bottom:1px solid #77889944;
            margin-bottom:18px;
          }
          .vx-tabs button {
            background:transparent;
            color:inherit;
            border:0;
            padding:16px 10px;
            font-weight:600;
            cursor:pointer;
          }
          .vx-tabs .vx-selected {
            border-bottom:3px solid #ba9a60;
          }
          .vx-compose,.vx-post {
            border:1px solid #77889944;
            border-radius:16px;
            padding:18px;
            margin-bottom:14px;
          }
          .vx-author {
            display:flex;
            align-items:center;
            gap:12px;
          }
          .vx-author small {
            display:block;
            opacity:.65;
            font-size:12px;
          }
          .vx-author .btn {
            margin-left:auto;
          }
          .vx-avatar {
            width:44px;
            height:44px;
            flex-shrink:0;
            border-radius:50%;
            background:#284d5b;
            color:white;
            display:grid;
            place-items:center;
            font-weight:700;
          }
          .vx-story {
            white-space:pre-wrap;
            overflow-wrap:anywhere;
            line-height:1.65;
          }
          .vx-actions {
            display:flex;
            flex-wrap:wrap;
            gap:6px;
            border-top:1px solid #77889933;
            padding-top:12px;
          }
          .vx-actions .btn {
            border:0;
            background:transparent;
            color:inherit;
            font-size:13px;
            padding:8px;
          }
          .vx-post h3 {
            margin:16px 0 6px;
          }
          """)

          h=Path("website/dist/index.html")
          t=h.read_text()
          t=t.replace("</head>",
              '<link rel="stylesheet" href="social-feed.css"></head>')
          import re
          t=re.sub(r'members\.js(?:\?[^"]*)?"',
                   'members.js?v=community4"',t)
          h.write_text(t)
          PY
          node --check website/dist/members.js
      - name: Enable community photos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("website/dist/members.js")
          s = p.read_text()

          extra = r"""
          async function compressPhoto(file){
            const url=URL.createObjectURL(file);
            try{
              const img=new Image();
              img.src=url;
              await img.decode();
              const canvas=document.createElement('canvas');
              const scale=Math.min(1,1600/Math.max(img.width,img.height));
              canvas.width=Math.max(1,Math.round(img.width*scale));
              canvas.height=Math.max(1,Math.round(img.height*scale));
              const ctx=canvas.getContext('2d');
              ctx.fillStyle='#ffffff';
              ctx.fillRect(0,0,canvas.width,canvas.height);
              ctx.drawImage(img,0,0,canvas.width,canvas.height);
              for(let q=.85;q>=.15;q-=.1){
                const blob=await new Promise(resolve=>
                  canvas.toBlob(resolve,'image/jpeg',q));
                if(blob&&blob.size<=512000)return blob;
              }
              throw Error('Photo too large after compression.');
            }finally{URL.revokeObjectURL(url)}
          }

          async function publishPhotos(){
            if(!ready())return;
            form('Share your voyage',
              field('title','Title','text','',true)+
              field('story','Caption','textarea','',true)+
              '<label>Travel photos (maximum 4)'+
              '<input type="file" name="photos" multiple accept="image/jpeg,image/png,image/webp"></label>'+
              '<label><input type="checkbox" name="rights" required> I own these photos and agree to publish them publicly.</label>',
              async(d,el)=>{
                const files=[...el.querySelector('[name="photos"]').files];
                if(files.length<1||files.length>4)
                  throw Error('Select between 1 and 4 photos.');
                if(d.story.trim().length<10)
                  throw Error('Caption must contain at least 10 characters.');
                const user=await api('/auth/v1/user');
                const paths=[];
                try{
                  for(const file of files){
                    const blob=await compressPhoto(file);
                    const path=user.id+'/'+crypto.randomUUID()+'.jpg';
                    const r=await fetch(
                      config.url+'/storage/v1/object/voyage-photos/'+path,{
                      method:'POST',
                      headers:{
                        apikey:config.key,
                        Authorization:'Bearer '+token.access_token,
                        'Content-Type':'image/jpeg'
                      },
                      body:blob
                    });
                    if(!r.ok)throw Error('Photo upload failed.');
                    paths.push(path);
                  }
                  await rpc('publish_photo',{
                    heading:d.title,
                    content:d.story,
                    photo_paths:paths,
                    rights:d.rights==='on'
                  });
                }catch(err){
                  if(paths.length){
                    try{
                      await api('/storage/v1/object/voyage-photos',
                        'DELETE',{prefixes:paths});
                    }catch{}
                  }
                  throw err;
                }
                modal('<h2>Photos published</h2><p>Close this window and refresh the Community feed.</p>');
              },'Publish photos');
          }
          """

          target="let socialTab='all';"
          assert target in s
          s=s.replace(target,extra+"\n"+target,1)

          target="${button('Create post','discussion')}"
          assert target in s
          s=s.replace(target,target+
            "${button('Add photos','photo-post')}",1)

          target="if(cmd==='discussion')publish('discussion');"
          assert target in s
          s=s.replace(target,target+
            "\nif(cmd==='photo-post')await publishPhotos();",1)

          target="let data=await rpc('feed',{page_no:feedPage});"
          assert target in s
          s=s.replace(target,target+"""
            const photoRows=await rpc('feed_photos',{page_no:feedPage});
            const photoMap=new Map(photoRows.map(x=>[x.id,x.photos]));
          """,1)

          target='<p class="vx-story">${html(r.body)}</p>'
          assert target in s
          s=s.replace(target,target+"""
            <div class="vx-photos">
              ${(photoMap.get(r.id)||[]).map(path=>{
                const src=config.url+
                  '/storage/v1/object/public/voyage-photos/'+
                  path.split('/').map(encodeURIComponent).join('/');
                return `<a href="${html(src)}" target="_blank" rel="noopener">
                  <img src="${html(src)}" loading="lazy" alt="Travel photograph">
                </a>`;
              }).join('')}
            </div>
          """,1)

          p.write_text(s)

          css=Path("website/dist/social-feed.css")
          with css.open("a") as f:
              f.write("""
          .vx-feed{max-width:760px}
          .vx-photos{
            display:flex;
            overflow-x:auto;
            scroll-snap-type:x mandatory;
            gap:8px;
            border-radius:12px;
          }
          .vx-photos:empty{display:none}
          .vx-photos a{
            flex:0 0 100%;
            scroll-snap-align:start;
          }
          .vx-photos img{
            width:100%;
            max-height:650px;
            object-fit:contain;
            display:block;
            border-radius:12px;
          }
          .vx-post{
            padding:16px;
            margin-bottom:12px;
          }
          """)

          h=Path("website/dist/index.html")
          h.write_text(h.read_text().replace(
              "members.js?v=community4",
              "members.js?v=community6"
          ))
          PY
          node --check website/dist/members.js
      - name: Connect Supabase
        working-directory: website
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/configure.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - uses: actions/deploy-pages@v4
